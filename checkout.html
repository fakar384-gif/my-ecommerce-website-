<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopNest</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo"><a href="index.html" class="product-link">ShopNest</a></div>
        <div class="nav-icons">
            <button id="themeToggle" class="icon-btn">🌙</button>
          <a href="login.html" id="authLink" style="text-decoration:none; color:inherit; font-weight:600;">👤 Login</a>
        </div>
    </header>

    <!-- Checkout Section -->
    <main class="checkout-container">
        
        <!-- Left Side: Billing Details -->
        <div class="billing-details">
            <h2 class="checkout-title">Billing & Shipping Details</h2>
            <form class="checkout-form" id="checkoutForm">
                <div class="form-group-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" placeholder="Enter your first name" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" placeholder="Enter your last name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label>Shipping Address</label>
                    <input type="text" placeholder="123 Main Street, Appt 4B" required>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" placeholder="City" required>
                    </div>
                    <div class="form-group">
                        <label>Zip Code</label>
                        <input type="text" placeholder="Zip Code" required>
                    </div>
                </div>

                <h3 class="payment-title">Payment Method</h3>
                <div class="payment-methods">
                    <label class="payment-option">
                        <input type="radio" name="payment" value="card" checked>
                        Credit / Debit Card 💳
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="payment" value="paypal">
                        PayPal
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="payment" value="cod">
                        Cash on Delivery (COD) 💵
                    </label>
                </div>
            </form>
        </div>

        <!-- Right Side: Order Summary -->
        <div class="order-summary-box">
            <h2 class="checkout-title">Order Summary</h2>
            
            <div class="checkout-items" id="checkoutItemsContainer">
                <!-- JavaScript এর মাধ্যমে কার্টের ডাটা এখানে আসবে -->
            </div>

            <div class="summary-totals">
                <div class="summary-line">
                    <span>Subtotal</span>
                    <span id="checkoutSubtotal">$0.00</span>
                </div>
                <div class="summary-line">
                    <span>Shipping</span>
                    <span>$10.00</span>
                </div>
                <div class="summary-line">
                    <span>Estimated Tax (5%)</span>
                    <span id="checkoutTax">$0.00</span>
                </div>
                <div class="summary-line grand-total">
                    <span>Total</span>
                    <span id="checkoutTotal">$0.00</span>
                </div>
            </div>

            <button type="submit" form="checkoutForm" class="place-order-btn" id="placeOrderBtn">Place Order</button>
        </div>

    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
